# Publishes a release when a version tag is pushed (git tag v1.2.3 && git push --tags).
#
# The release contains only DayPatch.app (this repo's companion + the daypatch
# patch). Nothing of Dia's is downloaded, built or shipped: each user's DayPatch
# builds Dia ✦ from their own installed Dia.
#
# Secrets:
#   DAYPATCH_UPDATE_PRIVATE_KEY   required. Signs DayPatch.zip for the in-app updater
#                              (scripts/make-update-key.sh creates it).
#   Optional, for a Developer ID signed + notarized app (no Gatekeeper warning):
#   APPLE_CERTIFICATE_P12      base64 of a "Developer ID Application" .p12
#   APPLE_CERTIFICATE_PASSWORD password of that .p12
#   APPLE_ID, APPLE_APP_PASSWORD, APPLE_TEAM_ID   for notarytool
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      HAS_DEVELOPER_ID: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches VERSION
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION)" || { echo "Tag ${GITHUB_REF_NAME} != v$(cat VERSION)"; exit 1; }

      - name: Tests
        run: ./tests/run.sh

      - name: Build DayPatch.app
        run: ./companion/build.sh --no-install

      - name: Sign with Developer ID and notarize
        if: env.HAS_DEVELOPER_ID == 'true'
        env:
          P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          IDENTITY="Developer ID Application"
          codesign -f -s "$IDENTITY" --options runtime --timestamp build/DayPatch.app/Contents/Resources/daypatch.dylib
          codesign -f -s "$IDENTITY" --options runtime --timestamp build/DayPatch.app
          ditto -c -k --keepParent build/DayPatch.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple build/DayPatch.app

      - name: Package and sign the update
        env:
          DAYPATCH_UPDATE_PRIVATE_KEY: ${{ secrets.DAYPATCH_UPDATE_PRIVATE_KEY }}
        run: |
          test -n "$DAYPATCH_UPDATE_PRIVATE_KEY" || { echo "DAYPATCH_UPDATE_PRIVATE_KEY secret is not set"; exit 1; }
          test -s companion/update-public-key.txt || { echo "companion/update-public-key.txt is missing"; exit 1; }
          ditto -c -k --keepParent build/DayPatch.app DayPatch.zip
          swift tools/update-key.swift sign DayPatch.zip > DayPatch.zip.sig
          swift tools/update-key.swift verify DayPatch.zip DayPatch.zip.sig "$(cat companion/update-public-key.txt)"
          shasum -a 256 DayPatch.zip > DayPatch.zip.sha256

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="DayPatch ${GITHUB_REF_NAME#v}. Install: unzip, move DayPatch.app to Applications, open it."
          if [ "$HAS_DEVELOPER_ID" != "true" ]; then
            NOTES="$NOTES This build isn't notarized: the first time, right-click DayPatch.app → Open."
          fi
          gh release create "$GITHUB_REF_NAME" DayPatch.zip DayPatch.zip.sig DayPatch.zip.sha256 \
            --title "DayPatch ${GITHUB_REF_NAME#v}" --notes "$NOTES" --generate-notes
